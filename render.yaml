# Render Blueprint for the Rails API (backend/).
# Dashboard: New → Blueprint → select this repo → Apply.
#
# Region is Singapore (closest to UTC+7). Change `region` on every service
# and the database together if you want something else — they must match.
#
# Starter web + worker and basic-256mb Postgres are the cheapest combination
# that supports Sidekiq, pre-deploy migrations, and a database that is not
# deleted after 30 days. Free web services spin down; workers are paid-only.

databases:
  - name: social-scheduler-db
    databaseName: social_scheduler
    user: social_scheduler
    region: singapore
    plan: basic-256mb

services:
  - type: keyvalue
    name: social-scheduler-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: social-scheduler-api
    runtime: ruby
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: "./bin/render-build.sh"
    preDeployCommand: "bin/rails db:prepare"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - fromGroup: social-scheduler-secrets
      - fromGroup: social-scheduler-settings
      - key: DATABASE_URL
        fromDatabase:
          name: social-scheduler-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: social-scheduler-redis
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "5"

  - type: worker
    name: social-scheduler-worker
    runtime: ruby
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec sidekiq -C config/sidekiq.yml"
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - fromGroup: social-scheduler-secrets
      - fromGroup: social-scheduler-settings
      - key: DATABASE_URL
        fromDatabase:
          name: social-scheduler-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: social-scheduler-redis
          property: connectionString

envVarGroups:
  - name: social-scheduler-secrets
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DEVISE_JWT_SECRET_KEY
        generateValue: true
      - key: AR_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: AR_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true

  - name: social-scheduler-settings
    envVars:
      - key: RAILS_ENV
        value: production
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: DEVISE_MAILER_SENDER
        value: no-reply@example.com
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      - key: SIDEKIQ_CONCURRENCY
        value: "5"
