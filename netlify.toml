# SPA on Netlify. Publish the Vite build, not the frontend/ source tree —
# shipping index.html with /src/main.js makes every client route (e.g. /login)
# a 404 because those paths are not real files.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
